# Palm + differential IK defaults for Pour (deformable cup; registered Gym id below).
# Load explicitly:  --ik-config scripts/rsl_rl/ik_rl/configs/ik_rl_pour.yaml
# (Pickup still auto-loads ik_rl_pickup.yaml when present; this file is not auto-selected by task.)
#
# Trajectory names must exist on the env: ``cup`` (DeformableObject) and ``goal_cup`` tensors
# (goal_cup_pos / goal_cup_rot). Override via CLI as needed.

task: Isaac-UR10eShadowHand-PourDeformable-Direct-v0

trajectory: "cup:200:0,goal_cup:200:0,goal_cup:-1:1"

# 手腕到手掌
palm_in_wrist_pos: [0.0, 0.0, 0.35]
# rad; ~ (pi/2, -pi/2, pi/2)
palm_in_wrist_euler: [1.5707963267948966, -1.5707963267948966, 1.5707963267948966]
# 手掌到目标物体的偏移
object_to_palm_offset: [0.0, 0.05, 0.0]


palm_orient: pickup_down
palm_yaw_offset: 3.141592653589793
palm_euler: [0.0, 2.2, 0.0]
# 手掌朝向（旋转标志为0）
palm_normal_local: [0.0, 0.0, 1.0]
world_down: [0.0, 0.0, -1.0]
#  （旋转标志为0）
palm_euler_in_anchor: [0.0, 0.0, 3.141592653589793]

ee_body: wrist_3_link
ik_method: dls
ik_lambda: null
