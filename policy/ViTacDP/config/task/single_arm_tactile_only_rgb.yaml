# Data-shape template only; not a train-ready task configuration.
# The current RobotImageDataset still requires camera, camera_pos, and tac_pos.
# Use prepare_dataset.py --profile tactile_only for offline data preparation;
# adapt the dataset/policy loaders before using this template for training.
name: single_arm_tactile_only_rgb
camera_num: 0
tac_num: 5
tac_type: tac_rgb
agent_dim: 30

shape_meta:
  obs:
    tac_rgb:
      shape: [${task.tac_num}, 3, 32, 32]
      type: tac_rgb
    agent_pos:
      shape: [${task.agent_dim}]
      type: low_dim
  action:
    shape: [${task.agent_dim}]

dataset:
  _target_: vitacdp_core.dataset.vitac_dataset.RobotImageDataset
  zarr_path: data/placeholder.zarr
  shape_meta: ${task.shape_meta}
  camera_num: ${task.camera_num}
  tac_num: ${task.tac_num}
  tac_type: ${task.tac_type}
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1'}
  pad_after: ${eval:'${n_action_steps}-1'}
  seed: 42
  val_ratio: 0.02
  batch_size: 16
  max_train_episodes: null
