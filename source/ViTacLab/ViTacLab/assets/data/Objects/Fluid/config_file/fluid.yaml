objects:
  common:
    # 水初始位置范围（世界坐标），对齐 ViTacLab 纸杯中心 (0.8, 0.15, 0.05) 附近。
    # 这里给出一个非常小的包围盒，使水粒子都落在杯子内部上方一点点。
    # [x_min, y_min, z_min, x_max, y_max, z_max]
    initial_pos_range: [0.78, 0.13, 0.10, 0.82, 0.17, 0.14]
    initial_ori_range: [0, 0, 0, 0, 0, 0]
    # soft reset 时使用同样的范围，保证每次重置都在杯内
    soft_reset_pos_range: [0.78, 0.13, 0.10, 0.82, 0.17, 0.14]
    soft_reset_ori_range: [0, 0, 0, 0, 0, 0]
    scale: [1.5, 1.5, 1.5]

  fluid_items:
    common:
    usd: ["XXX.usd"]
    num_per_env: 1
    random: True
    interaction_with_object: False

    fluid_items_1:
      visual:
        scale: [1.3,1.3,1.3]
        container_scale: [1.0,1.0,1.0]
        visual_material:
          material_usd_folder: [
            "source/ViTacLab/ViTacLab/assets/data/Objects/Fluid/Textiles/Leather_Brown.mdl",
          ]

      # pos: [0.0, 0.0, 1.2]
      # ori: [0.0,0.0,0.0]
      physics:
        type: "fluid"
        particle_system:
          particle_contact_offset: 0.0025
          contact_offset: 0.0025
          rest_offset: 0.0024
          fluid_rest_offset: 0.0015
          solid_rest_offset: 0.0015
          max_velocity: 0.5
          smoothing: False
          anisotropy: False
          isosurface: True

        particle_material:
          adhesion: null
          adhesion_offset_scale: null
          cohesion: 0.01
          particle_adhesion_scale: null
          particle_friction_scale: null
          drag: null
          lift: null
          friction: 0.1
          damping: 0.99
          gravity_scale: 1.0
          viscosity: 0.0091
          vorticity_confinement: null
          surface_tension: 0.0074
          density: null
          cfl_coefficient: null

        fluid_volumn: 1

